<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="icon" type="image/png" sizes="16x16" href="https://cdn.phototourl.com/free/2026-05-23-d4a1ce4d-3412-496d-ab71-9633a84e7108.png">

<title>KidZania Oto Servis</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: url('https://cdn.phototourl.com/free/2026-05-23-a152f863-78aa-41c3-b4ce-9d8d198f1035.png') no-repeat center center fixed;
  background-size: cover;
  min-height: 100vh;
  color: white;
  overflow-x: hidden;
  overflow-y: auto; 
}

.page { 
  display: none; 
  padding: 20px;
  box-sizing: border-box;
}
.active { display: block; }

.kai {
  font-size: 70px;
  font-weight: bold;
  margin-top: 50px;
  background: linear-gradient(45deg, red, yellow, lime, cyan);
  -webkit-background-clip: text;
  color: transparent;
}

.title {
  font-size: 44px;
  font-weight: bold;
  margin-top: 20px;
  padding: 0 10px;
}
  
button {
  padding: 16px 30px;
  margin: 12px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: white;
  background: linear-gradient(45deg, #ff9800, #ff5722);
  border: none;
  border-radius: 16px;
  cursor: pointer;
  max-width: 90%;
  box-sizing: border-box;
  box-shadow:
    0 6px 0 #c2410c,
    0 10px 20px rgba(0,0,0,0.35);
  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    filter 0.2s ease;
}
#page1 button {
  margin-top: 40px; 
}

#infoPage button {
  margin-top: 45px;
}

#listPage button {
  margin-top: 35px;
}

#actions button {
  margin-top: 275px; 
}

#finalPage button {
  margin-top: 40px;
}

button:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow:
    0 9px 0 #c2410c,
    0 14px 25px rgba(0,0,0,0.45);
  filter: brightness(1.08);
}

button:active {
  transform: translateY(4px) scale(0.95);
  box-shadow:
    0 2px 0 #c2410c,
    0 5px 10px rgba(0,0,0,0.3);
}

.btn-control {
  background: linear-gradient(45deg, #3498db, #2980b9) !important;
  box-shadow:
    0 6px 0 #1f5f8b,
    0 10px 20px rgba(0,0,0,0.35) !important;
}

.btn-control:hover {
  box-shadow:
    0 9px 0 #1f5f8b,
    0 14px 25px rgba(0,0,0,0.45) !important;
}

.btn-control:active {
  box-shadow:
    0 2px 0 #1f5f8b,
    0 5px 10px rgba(0,0,0,0.3) !important;
}

.btn-next {
  background: linear-gradient(45deg, #2ecc71, #27ae60) !important;
  box-shadow:
    0 6px 0 #1e8449,
    0 10px 20px rgba(0,0,0,0.35) !important;
}

.btn-next:hover {
  box-shadow:
    0 9px 0 #1e8449,
    0 14px 25px rgba(0,0,0,0.45) !important;
}

.btn-next:active {
  box-shadow:
    0 2px 0 #1e8449,
    0 5px 10px rgba(0,0,0,0.3) !important;
}


.btn-home {
  position: fixed !important;
  bottom: 20px !important;
  right: 20px !important;
  z-index: 99999 !important;
  padding: 12px 24px !important;
  white-space: nowrap;
  font-size: 16px !important;
  min-width: 140px !important;
  background: linear-gradient(45deg, #e74c3c, #c0392b) !important;
  box-shadow:
    0 4px 0 #962d22,
    0 8px 15px rgba(0,0,0,0.4) !important;
}

.btn-home:hover {
  transform: translateY(-3px) scale(1.03) !important;
  box-shadow:
    0 6px 0 #962d22,
    0 10px 20px rgba(0,0,0,0.5) !important;
}

.btn-home:active {
  transform: translateY(4px) scale(0.95) !important;
  box-shadow:
    0 2px 0 #962d22,
    0 4px 8px rgba(0,0,0,0.3) !important;
}

.bounce {
  display: inline-block;
  animation: bounce 1s infinite;
}

@keyframes bounce {
  0% {transform: translateY(0);}
  50% {transform: translateY(-10px);}
  100% {transform: translateY(0);}
}

.tick {
  font-size: 40px;
  color: lime;
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: 0;
  animation: fall 4s linear forwards;
}

@keyframes fall {
  to { transform: translateY(100vh) rotate(720deg); }
}

.info-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px; 
  max-width: 800px;
  margin: 0 auto 20px auto;
  padding: 20px;
  flex-wrap: wrap; 
}

.info-text {
  text-align: left; 
  font-size: 16px;
  font-weight: bold;
  border-radius: 15px; 
  padding: 20px;
  background: rgba(0, 0, 0, 0.2);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
}

.info-image img {
  width: 376px; 
  height: 275px;
  border-radius: 15px; 
  background: rgba(0, 0, 0, 0.2);
  box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
}
  #splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #ffffff; /* Arka plan rengi (İstersen değiştirebilirsin) */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999; /* Her şeyin en üstünde durması için */
    transition: opacity 0.5s ease; /* Kapanırken yumuşakça solma efekti */
}

.splash-logo {
    width: 150px; /* Logonun ekrandaki büyüklüğü */
    height: auto;
    margin-bottom: 20px;
    animation: pulse 1.5s infinite ease-in-out; /* Logoya hafif büyüme küçülme efekti */
}

.loading-bar {
    width: 200px;
    height: 4px;
    background-color: #e0e0e0;
    border-radius: 2px;
    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;
    background-color: #ff0000; /* Yükleme çubuğu rengi (Örn: Kidzania Kırmızısı) */
    animation: load 2.5s forwards linear; /* 2.5 saniyede dolacak */
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@keyframes load {
    to { width: 100%; }
}
</style>
</head>

<body>

<div id="splash-screen">
  <img src="https://i.hizliresim.com/81pvn37.png" alt="Logo" class="splash-logo">
  <div class="loading-bar"><div class="progress"></div></div>
</div>

<div class="page active" id="page1">
  <div class="kai">KAI!</div>
  <div class="title">🚗 KidZania İstanbul Oto Servis'e Hoş Geldiniz</div>
  <button onclick="start()">🚗 Araç Analizi</button>
</div>

<div class="page" id="controlPage">
  <h2 style="margin-top: 100px;">⏳ Araç analiz ediliyor...</h2>
  <button class="btn-home" onclick="resetApp()">🏠 Ana Sayfa</button>
</div>

<div class="page" id="infoPage">
  <h2>🚗 Araç Bilgisi</h2>

  <div class="info-container">
    <div class="info-image">
      <img src="arac.png" alt="Araç Fotoğrafı">
    </div>
    <div class="info-text">
      <p>
        🚘 KidZania İST 2013 Model<br>
        ✅ Muayene: Mayıs 2026<br>
        📅 Sonraki: Mayıs 2028<br>
        🛣️ Kilometre: 230.998<br><br>
        <center>
        ARAÇ BAKIM VE MUAYENENİZİ ZAMANINDA<br>YAPTIRDIĞINIZ İÇİN 
      </p>
      <h3>⭐ ZANKS! ⭐</h3>
       </center>
    </div>
  </div>

  <button onclick="goProblems()">Aracı Kontrol Et</button>
  <button class="btn-home" onclick="resetApp()">🏠 Ana Sayfa</button>
</div>

<div class="page" id="listPage">
  <h2>🔍 Araç Sorunları</h2>
  <div id="problemList" style="font-size: 18px; line-height: 1.6;"></div>
  <button onclick="startFix()">Tamire Başla</button>
  <button class="btn-home" onclick="resetApp()">🏠 Ana Sayfa</button>
</div>

<div class="page" id="fixPage">
  <h2 id="problemText" style="margin-top: 40px;"></h2>

  <div id="actions"></div>

  <p id="status"></p>
  <button class="btn-home" onclick="resetApp()">🏠 Ana Sayfa</button>
</div>

<div class="page" id="finalPage">
  <h1 id="finalText" style="margin-top: 80px; line-height: 1.5;"></h1>
  <button onclick="location.reload()">✌️ Z-U!</button>
  <button class="btn-home" onclick="resetApp()">🏠 Ana Sayfa</button>
</div>

<script>

let currentProblem = 0;
let isSolved = false;
let isControlled = false;

const problems = [
  {
    text: "🌬️  Hava filtresi kirli, değiştirilmesi gerekiyor.",
    action: "Filtreyi Değiştir",
    result: "✅ Hava filtresi başarıyla değiştirildi!"
  },
  {
    text: "🛢️  Motor yağı eski, yenilenmesi gerekiyor.",
    action: "Motor Yağını Yenile",
    result: "✅ Motor yağı başarıyla yenilendi!"
  },
  {
    text: "💧  Cam suyu seviyesi düşük, ekleme yapılması gerekiyor.",
    action: "Cam Suyu Ekle",
    result: "✅ Cam suyu başarıyla eklendi!"
  },
  {
    text: "🚗  Ön lastikler aşınmış, yenilenmesi gerekiyor.",
    action: "Ön Lastikleri Yenile",
    result: "✅ Ön lastikler başarıyla yenilendi!"
  },
  {
    text: "⚡  Sigorta bağlantısı yok, kabloları kontrol ediniz.",
    action: "Kabloları Kontrol Et ve Bağla",
    result: "✅ Kablolar kontrol edildi, sigorta bağlantısı sağlandı!"
  }
];

function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function start() {
  showPage("controlPage");

  setTimeout(() => {
    if(document.getElementById("controlPage").classList.contains("active")) {
      showPage("infoPage");
    }
  }, 2000);
}

function goProblems() {
  let html = "";
  problems.forEach(p => {
    html += `<div><strong>${p.text}</strong></div><br>`;
  });
  document.getElementById("problemList").innerHTML = html;
  showPage("listPage");
}

function startFix() {
  currentProblem = 0;
  showProblem();
}

function showProblem() {
  showPage("fixPage");

  isSolved = false;
  isControlled = false;

  let p = problems[currentProblem];

  document.getElementById("problemText").innerHTML =
    `<span class="bounce">${p.text}</span>`;

  let nextText = "Sonraki Soruna Git";
  if (currentProblem >= problems.length - 1) {
    nextText = " İşlemi Bitir";
  }

  document.getElementById("actions").innerHTML = `
    <button id="fixBtn" onclick="solve()">⚙️ ${p.action}</button>
    <button id="controlBtn" class="btn-control" onclick="reControl()">🔄 Tekrar Kontrol Et</button>
    <button id="nextBtn" class="btn-next" onclick="nextProblem()">👉 ${nextText}</button>
  `;

  document.getElementById("status").innerHTML = "";
}

function solve() {
  isSolved = true;
  document.getElementById("status").innerHTML =
    `<div class="tick" style="color: #3498db;">ℹ️</div> Sistem tekrar analiz ediliyor, lütfen işlemi uygulayın.`;
}

function reControl() {
  if (!isSolved) {
    document.getElementById("status").innerHTML = 
      `<div class="tick" style="color: #f1c40f;">⚠️</div> Lütfen önce yukarıdaki tamir işlemini uygulayınız!`;
    return;
  }

  let p = problems[currentProblem];
  isControlled = true;
  
  document.getElementById("status").innerHTML =
    `<div class="tick">✔</div> ${p.result}`;

  confetti();
}

function nextProblem() {
  if (!isSolved) {
    document.getElementById("status").innerHTML = 
      `<div class="tick" style="color: #f1c40f;">⚠️</div> Lütfen önce tamir işlemini uygulayıp ardından sistemi kontrol ediniz!`;
    return;
  }
  
  if (isSolved && !isControlled) {
    document.getElementById("status").innerHTML = 
      `<div class="tick" style="color: #f1c40f;">⚠️</div> Tamir yapıldı! Lütfen sonraki soruna geçmeden önce 'Tekrar Kontrol Et' butonuna basarak sistemi test edin.`;
    return;
  }

  currentProblem++;

  if (currentProblem < problems.length) {
    showProblem();
  } else {
    showFinal();
  }
}

function confetti() {
  for (let i = 0; i < 15; i++) {
    let c = document.createElement("div");
    c.classList.add("confetti");

    c.style.left = Math.random() * window.innerWidth + "px";
    c.style.background =
      ["red","yellow","blue","green"][Math.floor(Math.random()*4)];

    document.body.appendChild(c);

    setTimeout(() => c.remove(), 3000);
  }
}

function showFinal() {
  showPage("finalPage");
  document.getElementById("finalText").innerHTML =
    "🏆 ZÜPERSİN! <br><br> USTA GÖREVİNİ TAMAMLADI! <br><br> ZANKS! 🏆";

  confetti();
}

function resetApp() {
  currentProblem = 0;
  isSolved = false;
  isControlled = false;
  showPage("page1");
}
window.addEventListener('load', function() {
    setTimeout(function() {
        var splash = document.getElementById('splash-screen');
        splash.style.opacity = 0;

        setTimeout(function() {
            splash.style.display = 'none';
        }, 500); // 500ms (0.5 saniye) ile opacity geçişini bekliyoruz
    }, 2500); // 2.5 saniye yükleme ekranını göster
});
</script>

</body>
</html>
